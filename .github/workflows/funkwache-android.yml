name: Funkwache Android

on:
  push:
    paths:
      - 'funkwache-android/**'
      - '.github/workflows/funkwache-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: funkwache-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test & build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: funkwache-apk
          path: funkwache-android/app/build/outputs/apk/release/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Funkwache.apk
      - name: Publish as download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: funkwache-latest
          name: Funkwache (neueste Version)
          body: |
            Zum Installieren auf dem Android-Handy: unten unter "Assets" auf **Funkwache.apk** tippen.
            Gebaut aus Commit ${{ github.sha }}.
          prerelease: true
          files: funkwache-android/Funkwache.apk
