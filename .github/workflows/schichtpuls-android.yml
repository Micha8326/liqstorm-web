name: Schichtpuls Android

on:
  push:
    paths:
      - 'schichtpuls-android/**'
      - '.github/workflows/schichtpuls-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schichtpuls-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle page into app assets
        run: python3 tools/wrap.py
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Schichtpuls.apk
      - uses: actions/upload-artifact@v4
        with:
          name: schichtpuls-apk
          path: schichtpuls-android/Schichtpuls.apk
      - name: Publish as download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: schichtpuls-latest
          name: Schichtpuls Dienstplan-App (neueste Version)
          body: |
            Zum Installieren auf dem Android-Handy: unten unter "Assets" auf **Schichtpuls.apk** tippen und öffnen.
            Gebaut aus Commit ${{ github.sha }}.
          prerelease: true
          files: schichtpuls-android/Schichtpuls.apk
